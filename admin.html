  :root{

    --blue-pale: #e4ebf0;

  *{ box-sizing: border-box; }
  body{
    margin:0;

    color: var(--ink);

  h1{
    font-family: 'Cormorant Garamond', serif;

  }

    text-align: center;

    padding: 14px 20px;
    text-align: center;
    font-size: 15px;
    color: var(--ink-soft);

  }

    letter-spacing: 0.14em;

    font-size: 15px;
    color: var(--blue-deep);
    margin: 0 0 14px;
  }

  .person-card{
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }
  .person-name{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 8px;
    display:flex;
    align-items: baseline;
    gap: 8px;
  }
  .person-count{
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-soft);
  }
  .person-items{ font-size: 14.5px; color: var(--ink-soft); }
  .person-items div{ padding: 3px 0; }
  .person-items div::before{ content: "· "; color: var(--blue); }

  .activity-card{
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 20px;
    margin-bottom: 40px;
  }
  .activity-row{
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .activity-row:last-child{ border-bottom: none; }
  .activity-row .when{ display:block; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 2px; }
  .activity-row .what b{ color: var(--blue-deep); font-weight: 500; }

  .empty{ text-align:center; color: var(--ink-soft); font-family: 'Cormorant Garamond', serif; font-style: italic; padding: 20px 0 30px; }

  .visits-card{
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 20px;
    margin-bottom: 40px;
  }
  .visit-row{
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .visit-row:last-child{ border-bottom: none; }

  .loading{ text-align:center; color: var(--ink-soft); font-family: 'Cormorant Garamond', serif; font-style: italic; padding: 40px 0; }
  .note{

function escapeHtml(str){
  return str.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function formatTs(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}.${mm} o ${hh}:${min}`;
}

function findItemById(id){
  for (const cat of DATA) {
    const found = cat.items.find(it => it.id === id);
    if (found) return found;
  }
  return null;
}

const byPersonEl = document.getElementById('byPerson');
const activityEl = document.getElementById('activity');
const summaryEl = document.getElementById('summary');

function render(claims){
  byPersonEl.innerHTML = '';
  activityEl.innerHTML = '';

  const entries = Object.entries(claims); // [id, {name, ts}]
  const total = DATA.reduce((n, cat) => n + cat.items.length, 0);
  const taken = entries.length;

  summaryEl.innerHTML = `<b>${taken}</b> z <b>${total}</b> rzeczy zarezerwowanych`;

  if (entries.length === 0) {
    byPersonEl.innerHTML = '<div class="empty">Nikt jeszcze nic nie zarezerwował.</div>';
    activityEl.innerHTML = '<div class="empty">Brak aktywności.</div>';
    return;
  }

  // --- Group by person ---
  const byPerson = {}; // name -> [itemName, ...]
  entries.forEach(([id, claim]) => {
    const item = findItemById(id);
    if (!item) return;
    const name = claim.name || '—';
    if (!byPerson[name]) byPerson[name] = [];
    byPerson[name].push(item.name);
  });

  Object.keys(byPerson).sort((a, b) => a.localeCompare(b, 'pl')).forEach(name => {
    const items = byPerson[name];
    const card = document.createElement('div');
    card.className = 'person-card';
    card.innerHTML = `
      <div class="person-name">${escapeHtml(name)} <span class="person-count">(${items.length})</span></div>
      <div class="person-items">${items.map(n => `<div>${escapeHtml(n)}</div>`).join('')}</div>
    `;
    byPersonEl.appendChild(card);
  });

  // --- Recent activity feed, newest first ---
  const activity = entries
    .map(([id, claim]) => {
      const item = findItemById(id);
      return item ? { name: claim.name || '—', itemName: item.name, ts: claim.ts || 0 } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.ts - a.ts);

  activity.forEach(a => {
    const row = document.createElement('div');
    row.className = 'activity-row';
    row.innerHTML = `
      <span class="when">${a.ts ? formatTs(a.ts) : ''}</span>
      <span class="what"><b>${escapeHtml(a.name)}</b> zarezerwował(a): ${escapeHtml(a.itemName)}</span>
    `;
    activityEl.appendChild(row);
  });
}

const visitsEl = document.getElementById('visits');

function renderVisits(visits){
  visitsEl.innerHTML = '';
  const list = Object.values(visits).sort((a, b) => (b.ts || 0) - (a.ts || 0));

  if (list.length === 0) {
    visitsEl.innerHTML = '<div class="empty">Brak zarejestrowanych wejść.</div>';
    return;
  }

  const header = document.createElement('div');
  header.className = 'visit-row';
  header.innerHTML = `<b>Ostatnie wejście:</b> ${formatTs(list[0].ts)} &nbsp;·&nbsp; łącznie zarejestrowanych wejść: <b>${list.length}</b>`;
  visitsEl.appendChild(header);

  list.slice(0, 30).forEach(v => {
    const row = document.createElement('div');
    row.className = 'visit-row';
    row.textContent = formatTs(v.ts);
    visitsEl.appendChild(row);
  });
}

try{
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  db.ref('claims').on('value', (snapshot) => {
    render(snapshot.val() || {});
  }, (err) => {
    summaryEl.textContent = 'Błąd wczytywania danych — sprawdź połączenie.';
    console.error(err);
  });
  db.ref('visits').on('value', (snapshot) => {
    renderVisits(snapshot.val() || {});
  }, (err) => {
    console.error('Błąd wczytywania wejść', err);
  });
}catch(e){
  summaryEl.textContent = 'Błąd inicjalizacji Firebase.';
  console.error(e);
}
