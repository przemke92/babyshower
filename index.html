<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Shower w Kicinie!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fdfbf7;
    --ink: #3a352f;
    --ink-soft: #6b6459;
    --blue: #7c94a8;
    --blue-deep: #55738b;
    --line: #d9cfc0;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    line-height: 1.5;
    display: flex;
    align-items: center;
  }

  .wrap{ max-width: 620px; margin: 0 auto; padding: 40px 24px 60px; text-align: center; }

  .script{
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(52px, 11vw, 92px);
    color: var(--blue-deep);
    line-height: 1;
    margin: 0;
  }
  .title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 0.22em;
    font-size: clamp(26px, 6vw, 46px);
    margin: 6px 0 0;
    color: var(--ink);
  }

  .divider{ display:flex; align-items:center; justify-content:center; gap: 14px; margin: 26px auto; max-width: 420px; }
  .divider .rope{ height:1px; flex:1; background: var(--blue); opacity: 0.55; }
  .divider .heart{ color: var(--blue-deep); font-size: 17px; }

  .hero-image-wrap{ width: 100%; max-width: 220px; margin: 4px auto 30px; }
  .hero-image{ width: 100%; height: auto; display: block; margin: 0 auto; }

  .message{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(19px, 4vw, 24px);
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto;
  }

  .signoff{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    color: var(--blue-deep);
    font-size: clamp(18px, 3.4vw, 22px);
    margin-top: 26px;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="script">It's a boy!</p>
  <p class="title">BABY&nbsp;SHOWER</p>

  <div class="hero-image-wrap">
    <img src="image.png" alt="Baby Shower">
  </div>

  <div class="divider"><span class="rope"></span><span class="heart">♥</span><span class="rope"></span></div>

  <p class="message">Baby Shower już za nami! Dziękujemy z całego serca, że byliście z nami tego dnia! Wasza obecność i ciepło znaczyły dla nas naprawdę wiele.</p>

  <p class="signoff">Do zobaczenia! 💙</p>
</div>
</body>
</html>
